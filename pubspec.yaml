name: rentcar_tunisia
description: "RentCar Tunisia — location de voitures et ventes aux enchères (frontend Flutter)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
    
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.2
  intl: any

  # Persistence locale :
  # - sqflite → Android / iOS / desktop (APK)
  # - shared_preferences → web (Chrome) car sqflite n'y est pas supporté
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3

  # Appels HTTP vers Google Gemini (génération de quiz / examens)
  http: ^1.4.0

  # Upload photo véhicule (galerie / fichiers — web + mobile)
  image_picker: ^1.1.2
  # Photo de profil : choix « Galerie » (photo picker) ou « Fichiers »
  # (sélecteur de documents Android) via useAndroidPhotoPicker.
  image_picker_android: ^0.8.13+25
  image_picker_platform_interface: ^2.11.2

  # Hachage SHA-256 des mots de passe (table users)
  crypto: ^3.0.8

  # Position GPS (inscription, profil : agence la plus proche)
  geolocator: ^14.1.2
  google_sign_in: ^7.2.0
  google_mlkit_text_recognition: ^0.17.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  speech_to_text: ^7.5.0

  # Équipe : PDF (contrats, reçus), synthèse vocale
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_tts: ^4.2.5
  web: ^1.1.2
  shared_preferences_android: 2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Traductions FR / EN / AR (gen-l10n, voir l10n.yaml et lib/l10n/*.arb)
  generate: true
  assets:
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
