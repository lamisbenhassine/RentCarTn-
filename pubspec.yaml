name: rentcar_tunisia
description: "RentCar Tunisia — location de voitures et ventes aux enchères (frontend Flutter)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
    
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.2
  intl: any

  # Persistence locale :
  # - sqflite → Android / iOS / desktop (APK)
  # - shared_preferences → web (Chrome) car sqflite n'y est pas supporté
  sqflite: ^2.4.2
  path: ^1.9.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
